[package]
name = "linknote"
version = "0.1.0"
edition = "2024"
description = "A local Markdown notebook with a modeless, live-preview terminal editor"
license = "MIT"
repository = "https://github.com/Helios5018/linknote"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = "0.30"
pulldown-cmark = "0.13"
unicode-segmentation = "1.12"
unicode-width = "0.2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
arboard = { version = "3", default-features = false }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ureq = "3"
percent-encoding = "2"
similar = "2"
trash = { version = "5", default-features = false }
libc = "0.2"

[dev-dependencies]
proptest = "1"
